<svg viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for subtle depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FCD200" />
    </linearGradient>

    <!-- Glossy Overlay Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft Drop Shadow for the letter N -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.5" flood-color="#7A6200" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Main Outer Premium Dark Border -->
  <rect x="8" y="8" width="84" height="84" rx="18" ry="18" fill="#1A1A1A" />
  
  <!-- Vibrant Yellow Inner Base -->
  <rect x="13" y="13" width="74" height="74" rx="14" ry="14" fill="url(#bgGrad)" />

  <!-- Modern Dynamic Letter N with Smooth Drop Shadow -->
  <path d="M 33,68 C 33,68 44,29 44.5,28 C 45,27 46.5,27 48,27 C 49,27 52.5,27 52.5,27 L 61,53 C 61,53 68,29 68.5,28 C 69,27 70.5,27 72,27 C 73,27 76.5,27 76.5,27 L 66,66 C 65.5,68 63.5,68 62,68 C 61,68 57.5,68 57.5,68 L 50,44 L 42,66 C 41.5,67.5 39.5,68 38,68 C 37,68 33,68 33,68 Z" fill="#1A1A1A" filter="url(#dropShadow)" />

  <!-- Premium Glass/Gloss Effect Layer -->
  <path d="M 13,13 L 87,13 C 87,13 82,45 50,45 C 18,45 13,13 13,13 Z" fill="url(#glossGrad)" pointer-events="none" />
</svg>
