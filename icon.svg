<svg viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Replicating the CSS box-shadow (3px 3px 0px offset, solid black) -->
  <rect x="18" y="18" width="60" height="60" rx="4" ry="4" fill="#000000" transform="rotate(-3 50 50)" />
  
  <!-- Replicating the main box with 3px solid black border and var(--c-yellow) background -->
  <rect x="15" y="15" width="60" height="60" rx="4" ry="4" fill="#fce218" stroke="#000000" stroke-width="3" transform="rotate(-3 50 50)" />
  
  <!-- Replicating the letter 'N' with 30px font-size and var(--font-comic) stylistic slant -->
  <path d="M 37,63 L 45,29 L 53,29 L 61,51 L 67,27 L 75,27 L 66,61 L 58,61 L 51,39 L 45,63 Z" fill="#000000" transform="rotate(-3 50 50)" />
</svg>
